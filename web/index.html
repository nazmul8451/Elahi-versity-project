<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="PC Builder & Hardware E-Commerce - Custom PC Building, Compatibility Check & Order Management.">
  <meta name="theme-color" content="#2563EB">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="PC Builder - Customize Your Dream PC">
  <meta property="og:description" content="Build and customize your custom PC with automated compatibility checks, price calculator and order tracking.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PC Builder">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PC Builder - Customize Your Dream PC</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #F8FAFC;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #1E293B 0%, #0F172A 100%);
      z-index: 99999;
      transition: opacity 0.4s ease-out;
    }
    .logo-container {
      width: 80px;
      height: 80px;
      border-radius: 22px;
      background: linear-gradient(135deg, #2563EB, #06B6D4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.4);
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }
    .logo-icon {
      font-size: 38px;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .brand-subtitle {
      font-size: 13px;
      color: #94A3B8;
      margin-bottom: 32px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #2563EB;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 12px 30px rgba(37, 99, 235, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 16px 40px rgba(6, 182, 212, 0.5); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="logo-container">
      <span class="logo-icon">💻</span>
    </div>
    <div class="brand-title">PC Builder</div>
    <div class="brand-subtitle">Loading your hardware workspace...</div>
    <div class="spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.remove();
        }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
